<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#11152b">
<title>Рывок! — мини-аркада</title>
<style>
:root{color-scheme:dark;--bg:#0d1021;--panel:#171b33;--line:#2b3154;--text:#f4f5ff;--muted:#9ca4c8;--mint:#5cf2c2;--pink:#ff6b8d;--gold:#ffd166}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#28305b 0,transparent 55%),var(--bg);color:var(--text);font:500 16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}
.wrap{width:min(100%,920px)}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:0 auto 16px;max-width:760px}.brand{font-size:clamp(28px,5vw,44px);font-weight:900;letter-spacing:-.06em;margin:0}.brand span{color:var(--mint)}.tag{color:var(--muted);margin:4px 0 0}.stats{display:flex;gap:9px}.stat{min-width:92px;padding:10px 14px;background:#171b33cc;border:1px solid var(--line);border-radius:14px;text-align:center}.stat b{display:block;font-size:21px}.stat small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.board{position:relative;margin:auto;width:min(100%,760px);aspect-ratio:1.1875;background:#10142b;border:1px solid #343b63;border-radius:22px;overflow:hidden;box-shadow:0 24px 80px #050711aa,inset 0 0 50px #4b5fbe12}.board:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 97%,#ffffff08 98%),linear-gradient(90deg,transparent 97%,#ffffff08 98%);background-size:32px 32px;opacity:.4}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0d1021b8;backdrop-filter:blur(5px);z-index:2}.overlay.hidden{display:none}.card{width:min(88%,390px);padding:28px;background:#171b33f2;border:1px solid #39416d;border-radius:20px;text-align:center;box-shadow:0 20px 60px #0008}.card .emoji{font-size:46px}.card h2{font-size:28px;letter-spacing:-.04em;margin:8px 0}.card p{color:var(--muted);margin:0 0 20px}.btn{border:0;background:var(--mint);color:#082019;font:800 16px system-ui;padding:13px 23px;border-radius:12px;cursor:pointer;box-shadow:0 6px 22px #5cf2c244}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.hint{display:flex;justify-content:space-between;gap:16px;max-width:760px;margin:13px auto 0;color:var(--muted);font-size:13px}.keys{display:flex;gap:5px;align-items:center}.key{border:1px solid #454c70;border-radius:6px;padding:2px 7px;color:#dce0fa;background:#1a1e38;font-size:12px}.touch{display:none;justify-content:center;gap:16px;margin-top:12px}.touch button{width:66px;height:48px;border-radius:14px;border:1px solid #454c70;background:#171b33;color:#fff;font-size:23px;touch-action:none}
@media(max-width:600px){body{padding:14px}.wrap{width:100%}header{align-items:center}.stat{min-width:68px;padding:8px}.stat b{font-size:18px}.stat small{font-size:9px}.board{border-radius:16px}.hint{font-size:11px}.touch{display:flex}}
</style>
</head>
<body><main class="wrap">
<header><div><h1 class="brand">РЫВОК<span>!</span></h1><p class="tag">Лови звёзды. Уворачивайся. Не зевай.</p></div><div class="stats"><div class="stat"><b id="score">0</b><small>очки</small></div><div class="stat"><b id="best">0</b><small>рекорд</small></div><div class="stat"><b id="lives">♥♥♥</b><small>жизни</small></div></div></header>
<section class="board" aria-label="Игровое поле"><canvas id="game" width="900" height="760"></canvas><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="cardEmoji">⚡</div><h2 id="cardTitle">Готов к рывку?</h2><p id="cardText">Собирай золотые звёзды и не попадись под блоки. Управление — ← → или A / D.</p><button class="btn" id="start">Начать игру</button></div></div></section>
<div class="hint"><span class="keys"><span class="key">←</span><span class="key">→</span> или <span class="key">A</span><span class="key">D</span> — движение</span><span>Звезда = +10 · ♥ = ещё одна жизнь</span></div><div class="touch"><button id="left" aria-label="Влево">←</button><button id="right" aria-label="Вправо">→</button></div>
</main>
<script>
(()=>{const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),livesEl=document.querySelector('#lives');const W=900,H=760;let player,things,score,lives,best=Number(localStorage.getItem('ryvok-best')||0),running=false,last=0,spawn=0,difficulty=1,keys={};bestEl.textContent=best;
function reset(){player={x:W/2,y:H-78,w:48,h:48,speed:580,inv:0};things=[];score=0;lives=3;spawn=0;difficulty=1;last=0;updateStats()}
function updateStats(){scoreEl.textContent=score;bestEl.textContent=best;livesEl.textContent='♥'.repeat(lives)+'♡'.repeat(3-lives)}
function start(){reset();running=true;overlay.classList.add('hidden');requestAnimationFrame(loop)}
function end(){running=false;if(score>best){best=score;localStorage.setItem('ryvok-best',best)}updateStats();document.querySelector('#cardEmoji').textContent='💥';document.querySelector('#cardTitle').textContent='Раунд окончен';document.querySelector('#cardText').textContent=`Ты набрал ${score} очков. Рекорд: ${best}. Попробуешь ещё?`;document.querySelector('#start').textContent='Ещё раз';overlay.classList.remove('hidden')}
function spawnThing(){const star=Math.random()<.23,heart=!star&&Math.random()<.07;let size=star?30:heart?30:34+Math.random()*25;things.push({x:28+Math.random()*(W-56),y:-40,w:size,h:size,v:(star?210:250+Math.random()*110)*difficulty,type:star?'star':heart?'heart':'block',spin:Math.random()*6})}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#11152b';ctx.fillRect(0,0,W,H);for(let y=0;y<H;y+=32){ctx.strokeStyle='#ffffff08';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const t of things){ctx.save();ctx.translate(t.x,t.y);if(t.type==='star'){ctx.rotate(t.spin);ctx.fillStyle='#ffd166';ctx.shadowColor='#ffd166';ctx.shadowBlur=22;ctx.font='32px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,0)}else if(t.type==='heart'){ctx.shadowColor='#ff6b8d';ctx.shadowBlur=16;ctx.font='30px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('♥',0,0)}else{ctx.shadowColor='#ff557c';ctx.shadowBlur=14;const g=ctx.createLinearGradient(-t.w/2,-t.h/2,t.w/2,t.h/2);g.addColorStop(0,'#ff7790');g.addColorStop(1,'#b43d79');ctx.fillStyle=g;roundRect(-t.w/2,-t.h/2,t.w,t.h,8);ctx.fill()}ctx.restore()}ctx.save();ctx.translate(player.x,player.y);if(player.inv>0&&Math.floor(player.inv*12)%2)ctx.globalAlpha=.35;ctx.shadowColor='#5cf2c2';ctx.shadowBlur=22;ctx.fillStyle='#5cf2c2';roundRect(-player.w/2,-player.h/2,player.w,player.h,13);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#10211e';ctx.beginPath();ctx.arc(-9,-3,3,0,7);ctx.arc(9,-3,3,0,7);ctx.fill();ctx.strokeStyle='#10211e';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,5,7,.15,Math.PI-.15);ctx.stroke();ctx.restore()}
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000||0,.04);last=now;difficulty=1+score/140;score+=Math.floor(dt*10);player.inv=Math.max(0,player.inv-dt);let dir=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);player.x=Math.max(player.w/2+6,Math.min(W-player.w/2-6,player.x+dir*player.speed*dt));spawn+=dt;if(spawn>Math.max(.22,.68/difficulty)){spawn=0;spawnThing()}for(let i=things.length-1;i>=0;i--){let t=things[i];t.y+=t.v*dt;t.spin+=dt*2;if(Math.abs(t.x-player.x)<(t.w+player.w)*.42&&Math.abs(t.y-player.y)<(t.h+player.h)*.42){if(t.type==='star'){score+=10;things.splice(i,1);continue}if(t.type==='heart'){lives=Math.min(3,lives+1);things.splice(i,1);continue}if(player.inv<=0){lives--;player.inv=1.2;if(lives<=0){end();return}}things.splice(i,1);continue}if(t.y>H+60)things.splice(i,1)}if(score>best){best=score;localStorage.setItem('ryvok-best',best)}updateStats();draw();requestAnimationFrame(loop)}
document.querySelector('#start').addEventListener('click',start);window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(!running&&e.key==='Enter')start()});window.addEventListener('keyup',e=>keys[e.key]=false);function bind(id,key){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[key]=false)}bind('left','ArrowLeft');bind('right','ArrowRight');let drag=false;canvas.addEventListener('pointerdown',e=>{drag=true;movePointer(e)});canvas.addEventListener('pointermove',e=>{if(drag)movePointer(e)});window.addEventListener('pointerup',()=>drag=false);function movePointer(e){const r=canvas.getBoundingClientRect();player.x=Math.max(player.w/2,Math.min(W-player.w/2,(e.clientX-r.left)/r.width*W))}reset();draw()})();
</script></body></html>
