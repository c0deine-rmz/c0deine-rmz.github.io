<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>c0deine</title>
<meta name="description" content="c0deine — pharmaceutical grade human">
<meta property="og:title" content="c0deine">
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: #757575;
    --line: #222;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
    font-size: 15px;
    line-height: 24px;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--fg); color: var(--bg); }

  @media (hover: hover) and (pointer: fine) {
    * { cursor: none !important; }
  }

  .xcursor {
    position: fixed;
    left: 0; top: 0;
    width: 18px; height: 18px;
    margin: -9px 0 0 -9px;
    pointer-events: none;
    mix-blend-mode: difference;
    opacity: 0;
    transition: opacity .2s;
    z-index: 10001;
  }
  .xcursor::before, .xcursor::after {
    content: '';
    position: absolute;
    background: #fff;
    left: 50%; top: 50%;
    transition: transform .18s ease;
  }
  .xcursor::before { width: 18px; height: 1px; transform: translate(-50%,-50%); }
  .xcursor::after { width: 1px; height: 18px; transform: translate(-50%,-50%); }
  .xcursor.hot::before { transform: translate(-50%,-50%) rotate(45deg) scaleX(.75); }
  .xcursor.hot::after { transform: translate(-50%,-50%) rotate(45deg) scaleY(.75); }
  @media (hover: none), (pointer: coarse) {
    .xcursor { display: none; }
  }

  header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    color: var(--dim);
    letter-spacing: 0.04em;
  }
  header .mid { color: var(--fg); }
  header .right { text-align: right; }

  .tabs {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 13px 24px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .tabs .mid { display: flex; gap: 40px; justify-content: center; }
  .tab {
    background: none;
    border: none;
    color: var(--dim);
    font: inherit;
    letter-spacing: 0.18em;
    padding: 2px 0;
    position: relative;
    transition: color .15s;
  }
  .tab::after {
    content: '';
    position: absolute;
    left: 0; bottom: -3px;
    width: 100%; height: 1px;
    background: var(--fg);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .25s ease;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); }
  .tab.active::after { transform: scaleX(1); }

  .langs {
    justify-self: end;
    display: flex;
    gap: 7px;
    align-items: baseline;
    font-size: 12px;
  }
  .lang {
    background: none;
    border: none;
    color: var(--dim);
    font: inherit;
    letter-spacing: 0.1em;
    padding: 0 0 1px;
    border-bottom: 1px solid transparent;
    transition: color .15s;
  }
  .lang:hover { color: var(--fg); }
  .lang.active { color: var(--fg); border-bottom-color: var(--fg); }
  .lsep { color: #333; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }
  .view {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    width: 100%;
  }
  .view[hidden] { display: none; }

  .ava {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    filter: grayscale(1) contrast(1.05);
    border: 1px solid var(--line);
    opacity: 0;
  }
  body.started .ava { animation: avain 1.6s cubic-bezier(.2,.8,.2,1) .2s both; }
  @keyframes avain {
    from { opacity: 0; transform: scale(.9); filter: grayscale(1) contrast(1.05) blur(6px); }
    to { opacity: 1; transform: scale(1); filter: grayscale(1) contrast(1.05) blur(0); }
  }
  @keyframes fadein { to { opacity: 1; } }

  .name-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  h1 {
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 400;
    letter-spacing: 0.02em;
    display: flex;
  }
  h1 .ch {
    display: inline-block;
    opacity: 0;
  }
  body.started h1 .ch { animation: risein .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes risein {
    0% { opacity: 0; transform: translateY(12px); filter: blur(4px); }
    60% { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  .cursor {
    display: inline-block;
    width: 10px;
    height: 1.1em;
    background: var(--fg);
    margin-left: 6px;
    align-self: center;
    animation: blinker 1s linear infinite;
  }
  @keyframes blinker {
    0% { opacity: 1; } 49% { opacity: 1; }
    50% { opacity: 0; } 100% { opacity: 0; }
  }

  .pill-spin {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    transform-style: preserve-3d;
  }
  body.started .pill-spin { animation: coin 3.6s linear infinite; }
  @keyframes coin {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }

  .tagline {
    color: var(--dim);
    font-size: 13px;
    letter-spacing: 0.06em;
    text-align: center;
    opacity: 0;
  }
  body.started .tagline { animation: fadein .5s ease 2s both; }

  nav {
    width: 100%;
    max-width: 560px;
    margin-top: 12px;
  }
  ul.links {
    list-style: none;
    border-top: 1px solid var(--line);
    opacity: 0;
  }
  body.started ul.links { animation: fadein .8s ease 2.8s both; }
  ul.links li {
    opacity: 0;
    transform: translateY(14px);
    border-bottom: 1px solid var(--line);
    transition: color .1s ease-in-out;
  }
  body.started ul.links li:nth-child(1) { animation: rowin .9s cubic-bezier(.16,1,.3,1) 2.9s both; }
  body.started ul.links li:nth-child(2) { animation: rowin .9s cubic-bezier(.16,1,.3,1) 3.25s both; }
  body.started ul.links li:nth-child(3) { animation: rowin .9s cubic-bezier(.16,1,.3,1) 3.6s both; }
  @keyframes rowin {
    from { opacity: 0; transform: translateY(18px); filter: blur(6px); }
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  ul.links:has(> li:hover) > li:not(:hover) { color: #4a4a4a; }
  ul.links:has(> li:hover) > li:not(:hover) .handle { color: #333; }

  ul.links a, ul.links button {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    width: 100%;
    padding: 20px 4px;
    color: inherit;
    background: none;
    border: none;
    font: inherit;
    text-decoration: none;
    text-align: left;
  }
  .lbl { font-size: 17px; }
  .lbl .ch { display: inline-block; }
  li:hover .lbl .ch { animation: pupp2 .4s linear; }
  @keyframes pupp2 {
    0% { transform: scale(1); }
    50% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .handle { color: var(--dim); font-size: 13px; transition: color .1s ease-in-out; }
  li:hover .handle { color: var(--fg); }

  .sweep {
    position: fixed;
    left: 0; right: 0; top: 0;
    height: 2px;
    background: rgba(255,255,255,.07);
    pointer-events: none;
    z-index: 9998;
    opacity: 0;
  }
  body.started .sweep { animation: sweep 1.2s cubic-bezier(.4,0,.2,1) .1s both; }
  @keyframes sweep {
    0% { transform: translateY(-4px); opacity: 1; }
    100% { transform: translateY(100vh); opacity: .3; }
  }

  #gate {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .6s ease;
  }
  #gate.bye { opacity: 0; pointer-events: none; }
  #gate span {
    color: var(--dim);
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: lowercase;
    animation: gatepulse 1.8s ease-in-out infinite;
    padding: 20px;
  }
  @keyframes gatepulse {
    0%, 100% { opacity: .3; }
    50% { opacity: 1; }
  }

  .views {
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 0.08em;
    opacity: 0;
    margin-top: 2px;
  }
  body.started .views { animation: fadein 1s ease 4.4s both; }
  .views svg { display: block; }
  #vcount { color: var(--fg); font-size: 13px; letter-spacing: 0.08em; }

  .term {
    width: 100%;
    max-width: 560px;
    border: 1px solid var(--line);
    opacity: 0;
    animation: fadein .8s ease .1s forwards;
  }
  .term-bar {
    display: flex;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 0.06em;
  }
  .term-body {
    padding: 22px 18px 26px;
    min-height: 470px;
    font-size: 14px;
    line-height: 26px;
  }
  .tline { white-space: pre-wrap; word-break: break-word; }
  .tline.out { color: var(--dim); }
  .tline.gap { height: 26px; }
  .tprompt { color: var(--fg); }
  .tblock {
    display: inline-block;
    width: 9px;
    height: 1.1em;
    background: var(--fg);
    vertical-align: text-bottom;
    animation: blinker 1s linear infinite;
  }

  footer {
    padding: 18px 24px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: #4a4a4a;
    display: flex;
    justify-content: space-between;
    letter-spacing: 0.04em;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 72px;
    transform: translateX(-50%) translateY(10px);
    background: var(--fg);
    color: var(--bg);
    padding: 6px 14px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 560px) {
    .ava { width: 96px; height: 96px; }
    footer .r { display: none; }
    .term-body { font-size: 13px; line-height: 24px; min-height: 440px; }
    .tabs .mid { gap: 24px; }
  }
</style>
</head>

<script>
  // ---- i18n ----
  const i18n = {
    ru: {
      main: 'главная',
      about: 'обо мне',
      tag: 'пока ты спишь — твое время уходит',
      foot: 'не является лекарственным средством',
      toast: 'скопировано',
      views: 'просмотры',
      gate: 'нажми',
      script: [
        { cmd: 'whoami', out: ['c0deine'] },
        { cmd: 'id', out: ['фрилансер · вайбкодер · делаю красивую хуйню'] },
        { cmd: 'cat навыки.txt', out: ['python / java / js / lua'] },
        { cmd: 'cat статус.txt', out: ['открыт для заказов'] },
        { cmd: 'ls контакты/', out: ['steam   telegram   discord'] }
      ]
    },
    en: {
      main: 'main',
      about: 'about',
      tag: 'while you sleep — your time is running out',
      foot: 'not a medicinal product',
      toast: 'copied',
      views: 'views',
      gate: 'click',
      script: [
        { cmd: 'whoami', out: ['c0deine'] },
        { cmd: 'id', out: ['freelancer · vibecoder · i make pretty shit'] },
        { cmd: 'cat skills.txt', out: ['python / java / js / lua'] },
        { cmd: 'cat status.txt', out: ['open for work'] },
        { cmd: 'ls contacts/', out: ['steam   telegram   discord'] }
      ]
    }
  };
  let lang = localStorage.getItem('lang') || 'ru';

  const nameEl = document.getElementById('name');
  const chars = nameEl.textContent.split('');
  nameEl.textContent = '';
  chars.forEach((c, i) => {
    const s = document.createElement('span');
    s.className = 'ch';
    s.textContent = c;
    s.style.animationDelay = (1.0 + i * 0.14) + 's';
    nameEl.appendChild(s);
  });

  document.querySelectorAll('[data-split]').forEach(el => {
    const t = el.textContent.split('');
    el.textContent = '';
    t.forEach((c, i) => {
      const s = document.createElement('span');
      s.className = 'ch';
      s.textContent = c;
      s.style.animationDelay = (i * 0.06) + 's';
      el.appendChild(s);
    });
  });

  const toast = document.getElementById('toast');
  document.getElementById('dc').addEventListener('click', () => {
    navigator.clipboard.writeText('nikit0siq').catch(() => {});
    toast.textContent = i18n[lang].toast;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1400);
  });

  // ---- sounds ----
  let AC = null;
  function initAudio() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (AC && AC.state === 'suspended') AC.resume();
  }
  addEventListener('pointerdown', initAudio);
  addEventListener('keydown', initAudio);
  function tone(freq, dur, vol, type, slideTo) {
    if (!AC) return;
    try {
      const t = AC.currentTime;
      const o = AC.createOscillator();
      const g = AC.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(AC.destination);
      o.start(t);
      o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  const sndHover = () => tone(1500, 0.03, 0.012);
  const sndClick = () => tone(240, 0.07, 0.05, 'triangle', 110);
  const sndTick = () => tone(2100, 0.015, 0.006, 'square');
  document.querySelectorAll('ul.links a, ul.links button, .tab, .lang').forEach(el => {
    el.addEventListener('mouseenter', sndHover);
    el.addEventListener('click', sndClick);
  });

  // ---- печать теглайна ----
  let tagTyping = false;
  function typeTag() {
    tagTyping = true;
    const el = document.getElementById('tagtext');
    const text = i18n[lang].tag;
    let ci = 0;
    el.textContent = '';
    const iv = setInterval(() => {
      el.textContent = text.slice(0, ++ci);
      if (ci % 2 === 0) sndTick();
      if (ci >= text.length) { clearInterval(iv); tagTyping = false; }
    }, 34);
  }

  // ---- вход: клик открывает сайт, запускает звук и считает просмотр ----
  const gate = document.getElementById('gate');
  gate.addEventListener('click', () => {
    initAudio();
    sndClick();
    const vc = document.getElementById('vcount');
    const bump = !localStorage.getItem('vseen');
    fetch('https://abacus.jasoncameron.dev/' + (bump ? 'hit' : 'get') + '/c0deine-rmz/views26')
      .then(r => r.json())
      .then(j => {
        vc.textContent = j.value;
        if (bump) localStorage.setItem('vseen', '1');
      })
      .catch(() => { document.getElementById('views').style.display = 'none'; });
    gate.classList.add('bye');
    document.body.classList.add('started');
    document.getElementById('tagtext').textContent = '';
    const entrance = [];
    for (let i = 0; i < 7; i++) entrance.push([1000 + i * 140, 1]);
    [[2050, 0], [2900, 0], [3250, 0], [3600, 0], [4400, 0]].forEach(x => entrance.push(x));
    entrance.forEach(([t, isChar]) => setTimeout(() => {
      if (isChar) sndTick(); else tone(700, 0.05, 0.01);
    }, t + 400));
    setTimeout(typeTag, 2600);
    setTimeout(() => gate.remove(), 700);
  }, { once: true });

  // ---- custom cursor ----
  const xc = document.createElement('div');
  xc.className = 'xcursor';
  document.body.appendChild(xc);
  let mx = innerWidth / 2, my = innerHeight / 2, cxx = mx, cyy = my;
  addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    xc.style.opacity = 1;
    xc.classList.toggle('hot', !!e.target.closest('a,button,.tab,.lang,#gate'));
  });
  document.addEventListener('mouseleave', () => { xc.style.opacity = 0; });
  (function loop() {
    cxx += (mx - cxx) * 0.22;
    cyy += (my - cyy) * 0.22;
    xc.style.transform = 'translate(' + cxx + 'px,' + cyy + 'px)';
    requestAnimationFrame(loop);
  })();

  // ---- tabs ----
  const tabs = document.querySelectorAll('.tab');
  const views = {
    main: document.getElementById('view-main'),
    about: document.getElementById('view-about')
  };
  function show(name) {
    tabs.forEach(t => t.classList.toggle('active', t.dataset.view === name));
    for (const k in views) views[k].hidden = (k !== name);
    history.replaceState(null, '', name === 'about' ? '#about' : '#');
    if (name === 'about') startTerm();
  }
  tabs.forEach(t => t.addEventListener('click', () => show(t.dataset.view)));

  // ---- terminal ----
  const termbody = document.getElementById('termbody');
  let termRun = 0;

  function startTerm() {
    termRun++;
    const run = termRun;
    termbody.innerHTML = '';
    const script = i18n[lang].script;

    function addLine(cls) {
      const d = document.createElement('div');
      d.className = 'tline ' + cls;
      termbody.appendChild(d);
      return d;
    }
    function addGap() {
      const d = document.createElement('div');
      d.className = 'tline gap';
      termbody.appendChild(d);
    }
    function typeText(el, text, speed, done, tickEvery) {
      let ci = 0;
      const iv = setInterval(() => {
        if (run !== termRun) { clearInterval(iv); return; }
        el.textContent = text.slice(0, ++ci);
        if (ci % (tickEvery || 1) === 0) sndTick();
        if (ci >= text.length) { clearInterval(iv); if (done) done(); }
      }, speed);
    }
    function typeOut(lines, i, done) {
      if (run !== termRun) return;
      if (i >= lines.length) { done(); return; }
      const d = addLine('out');
      const s = document.createElement('span');
      d.appendChild(s);
      typeText(s, lines[i], 16, () => setTimeout(() => typeOut(lines, i + 1, done), 70), 3);
    }
    function typeCmd(i) {
      if (run !== termRun) return;
      if (i >= script.length) {
        const d = addLine('cmd');
        d.innerHTML = '<span class="tprompt">$ </span>';
        const b = document.createElement('span');
        b.className = 'tblock';
        d.appendChild(b);
        return;
      }
      const item = script[i];
      const line = addLine('cmd');
      line.innerHTML = '<span class="tprompt">$ </span>';
      const txt = document.createElement('span');
      line.appendChild(txt);
      typeText(txt, item.cmd, 55, () => {
        setTimeout(() => {
          if (run !== termRun) return;
          typeOut(item.out, 0, () => {
            addGap();
            setTimeout(() => typeCmd(i + 1), 240);
          });
        }, 160);
      });
    }
    typeCmd(0);
  }

  // ---- language ----
  function applyLang() {
    const d = i18n[lang];
    document.querySelector('[data-view="main"]').textContent = d.main;
    document.querySelector('[data-view="about"]').textContent = d.about;
    if (!tagTyping) document.getElementById('tagtext').textContent = d.tag;
    document.getElementById('foottext').textContent = d.foot;
    document.getElementById('views').title = d.views;
    const gt = document.getElementById('gatetext');
    if (gt) gt.textContent = d.gate;
    document.querySelectorAll('.lang').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    localStorage.setItem('lang', lang);
    if (!views.about.hidden) startTerm();
  }
  document.querySelectorAll('.lang').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    applyLang();
  }));
  applyLang();

  if (location.hash === '#about') show('about');
</script>
