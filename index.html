<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: #757575;
    --line: #222;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
    font-size: 15px;
    line-height: 24px;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--fg); color: var(--bg); }

  @media (hover: hover) and (pointer: fine) {
    * { cursor: none !important; }
  }

  .xcursor {
    position: fixed;
    left: 0; top: 0;
    width: 18px; height: 18px;
    margin: -9px 0 0 -9px;
    pointer-events: none;
    z-index: 9999;
    mix-blend-mode: difference;
    opacity: 0;
    transition: opacity .2s;
  }
  .xcursor::before, .xcursor::after {
    content: '';
    position: absolute;
    background: #fff;
    left: 50%; top: 50%;
    transition: transform .18s ease;
  }
  .xcursor::before { width: 18px; height: 1px; transform: translate(-50%,-50%); }
  .xcursor::after { width: 1px; height: 18px; transform: translate(-50%,-50%); }
  .xcursor.hot::before { transform: translate(-50%,-50%) rotate(45deg) scaleX(.75); }
  .xcursor.hot::after { transform: translate(-50%,-50%) rotate(45deg) scaleY(.75); }
  @media (hover: none), (pointer: coarse) {
    .xcursor { display: none; }
  }

  header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    color: var(--dim);
    letter-spacing: 0.04em;
  }
  header .mid { color: var(--fg); }
  header .right { text-align: right; }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 13px 24px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .tab {
    background: none;
    border: none;
    color: var(--dim);
    font: inherit;
    letter-spacing: 0.18em;
    padding: 2px 0;
    position: relative;
    transition: color .15s;
  }
  .tab::after {
    content: '';
    position: absolute;
    left: 0; bottom: -3px;
    width: 100%; height: 1px;
    background: var(--fg);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .25s ease;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); }
  .tab.active::after { transform: scaleX(1); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }
  .view {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    width: 100%;
  }
  .view[hidden] { display: none; }

  .ava {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    filter: grayscale(1) contrast(1.05);
    border: 1px solid var(--line);
    opacity: 0;
    animation: fadein 1.4s ease .3s forwards;
  }
  @keyframes fadein { to { opacity: 1; } }

  .name-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  h1 {
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 400;
    letter-spacing: 0.02em;
    display: flex;
  }
  h1 .ch {
    display: inline-block;
    opacity: 0;
    animation: pupp .4s linear forwards;
  }
  @keyframes pupp {
    0% { transform: scale(1); opacity: 0; }
    50% { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .cursor {
    display: inline-block;
    width: 10px;
    height: 1.1em;
    background: var(--fg);
    margin-left: 6px;
    align-self: center;
    animation: blinker 1s linear infinite;
  }
  @keyframes blinker {
    0% { opacity: 1; } 49% { opacity: 1; }
    50% { opacity: 0; } 100% { opacity: 0; }
  }

  .pill-spin {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    animation: coin 3.6s linear infinite;
    transform-style: preserve-3d;
  }
  @keyframes coin {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }

  .tagline {
    color: var(--dim);
    font-size: 13px;
    letter-spacing: 0.06em;
    text-align: center;
    opacity: 0;
    animation: fadein 1s ease 2.4s forwards;
  }

  nav {
    width: 100%;
    max-width: 560px;
    margin-top: 12px;
  }
  ul.links {
    list-style: none;
    border-top: 1px solid var(--line);
    opacity: 0;
    animation: fadein 1s ease 3s forwards;
  }
  ul.links li {
    opacity: 0;
    transform: translateY(14px);
    animation: rowin .6s ease forwards;
    border-bottom: 1px solid var(--line);
    transition: color .1s ease-in-out;
  }
  ul.links li:nth-child(1) { animation-delay: 3.1s; }
  ul.links li:nth-child(2) { animation-delay: 3.35s; }
  ul.links li:nth-child(3) { animation-delay: 3.6s; }
  @keyframes rowin {
    to { opacity: 1; transform: translateY(0); }
  }
  ul.links:has(> li:hover) > li:not(:hover) { color: #4a4a4a; }
  ul.links:has(> li:hover) > li:not(:hover) .handle { color: #333; }

  ul.links a, ul.links button {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    width: 100%;
    padding: 20px 4px;
    color: inherit;
    background: none;
    border: none;
    font: inherit;
    text-decoration: none;
    text-align: left;
  }
  .lbl { font-size: 17px; }
  .lbl .ch { display: inline-block; }
  li:hover .lbl .ch { animation: pupp2 .4s linear; }
  @keyframes pupp2 {
    0% { transform: scale(1); }
    50% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .handle { color: var(--dim); font-size: 13px; transition: color .1s ease-in-out; }
  li:hover .handle { color: var(--fg); }

  .term {
    width: 100%;
    max-width: 560px;
    border: 1px solid var(--line);
    opacity: 0;
    animation: fadein .8s ease .1s forwards;
  }
  .term-bar {
    display: flex;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 0.06em;
  }
  .term-body {
    padding: 22px 18px 26px;
    min-height: 420px;
    font-size: 14px;
    line-height: 26px;
  }
  .tline { white-space: pre-wrap; word-break: break-word; }
  .tline.out { color: var(--dim); }
  .tline.gap { height: 26px; }
  .tprompt { color: var(--fg); }
  .tblock {
    display: inline-block;
    width: 9px;
    height: 1.1em;
    background: var(--fg);
    vertical-align: text-bottom;
    animation: blinker 1s linear infinite;

  footer {

    color: #4a4a4a;

    justify-content: space-between;

  .toast {

    left: 50%;
    bottom: 72px;

    background: var(--fg);
    color: var(--bg);
    padding: 6px 14px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }

  addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    xc.style.opacity = 1;
    xc.classList.toggle('hot', !!e.target.closest('a,button,.tab'));
  });
  document.addEventListener('mouseleave', () => { xc.style.opacity = 0; });
  (function loop() {
    cxx += (mx - cxx) * 0.22;
    cyy += (my - cyy) * 0.22;
    xc.style.transform = 'translate(' + cxx + 'px,' + cyy + 'px)';
    requestAnimationFrame(loop);
  })();

  // ---- tabs ----
  const tabs = document.querySelectorAll('.tab');
  const views = {
    main: document.getElementById('view-main'),
    about: document.getElementById('view-about')
  };
  function show(name) {
    tabs.forEach(t => t.classList.toggle('active', t.dataset.view === name));
    for (const k in views) views[k].hidden = (k !== name);
    history.replaceState(null, '', name === 'about' ? '#about' : '#');
    if (name === 'about') startTerm();
  }
  tabs.forEach(t => t.addEventListener('click', () => show(t.dataset.view)));

  // ---- terminal ----
  const script = [
    { cmd: 'whoami', out: ['c0deine'] },
    { cmd: 'id', out: ['фрилансер · вайбкодер · верующий но наркоман'] },
    { cmd: 'cat навыки.txt', out: ['python / java / js', 'плагины для майнкрафта', 'профили стим под ключ', 'чб минимализм как образ жизни'] },
    { cmd: 'cat статус.txt', out: ['открыт для заказов'] },
    { cmd: 'ls контакты/', out: ['steam   telegram   discord'] }
  ];
  const termbody = document.getElementById('termbody');
  let termRun = 0;

  function startTerm() {
    termRun++;
    const run = termRun;
    termbody.innerHTML = '';
    let li = 0;

    function addLine(cls, htmlContent) {
      const d = document.createElement('div');
      d.className = 'tline ' + cls;
      d.innerHTML = htmlContent;
      termbody.appendChild(d);
      return d;
    }
    function addGap() {
      const d = document.createElement('div');
      d.className = 'tline gap';
      termbody.appendChild(d);
    }

    function typeCmd(i) {
      if (run !== termRun) return;
      if (i >= script.length) {
        const d = addLine('cmd', '<span class="tprompt">$ </span>');
        const b = document.createElement('span');
        b.className = 'tblock';
        d.appendChild(b);
        return;
      }
      const item = script[i];
      const line = addLine('cmd', '<span class="tprompt">$ </span>');
      const txt = document.createElement('span');
      line.appendChild(txt);
      let ci = 0;
      const iv = setInterval(() => {
        if (run !== termRun) { clearInterval(iv); return; }
        txt.textContent = item.cmd.slice(0, ++ci);
        if (ci >= item.cmd.length) {
          clearInterval(iv);
          setTimeout(() => {
            if (run !== termRun) return;
            item.out.forEach(o => addLine('out', o));
            addGap();
            setTimeout(() => typeCmd(i + 1), 260);
          }, 180);
        }
      }, 55);
    }
    typeCmd(0);
  }

  if (location.hash === '#about') show('about');
</script>

</body>
